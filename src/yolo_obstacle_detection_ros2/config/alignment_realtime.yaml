# HOLE-GUIDED BLOCK ALIGNMENT - Real-time Camera Configuration
# Resolution: 1280x720, letterbox resize from any source aspect ratio
# For source 640x480: active image = 960x720, letterbox padding L/R=160

video:
  processing_width: 1280
  processing_height: 720
  resize_mode: letterbox
  display: true
  save_output_video: false
  save_csv: true
  output_dir: "/home/otomasi2/Documents/AGV Forklift_5-8-26/ros/log/a2_alignment_validation"
  video_extension: ".mp4"

# Camera/fork reference setpoint (canvas 1280x720, zero-indexed).
# X = 640 (center), Y = 700 (just above bottom edge, 19 px margin).
# Reference axis drawn from (640,700) to (640,0).
setpoint:
  x_px: 640
  y_px: 700

hole_detection:
  class_name: "hole pallet"
  minimum_confidence: 0.55
  # pixel params scaled x1.5 from 640x480 canvas (letterbox scale 720/480 = 1.5)
  minimum_separation_px: 120
  maximum_separation_px: 750
  maximum_vertical_difference_px: 120
  maximum_size_ratio: 1.8
  maximum_center_jump_px: 45

block_detection:
  class_name: "block"
  minimum_confidence: 0.55
  # block_offset_along_centerline_px: distance from hole midpoint DOWN along centerline
  #   null = auto-calibrate from first valid frames (median of >=30 frames)
  #   float = fixed value in pixels (calibrated)
  block_offset_along_centerline_px: null
  block_offset_perpendicular_px: 0.0
  # scaled x1.5 from old 60/50/35
  roi_half_width_px: 90
  roi_half_height_px: 75
  maximum_block_residual_px: 53
  minimum_aspect_ratio: 0.3
  maximum_aspect_ratio: 3.0

yaw:
  # Offset for yaw. When fork is truly aligned and error shows e.g. -1.5 deg,
  # set this to -1.5 so output reads ~0 when aligned.
  setpoint_yaw_offset_deg: 5.0
  maximum_yaw_jump_deg: 8.0

filter:
  hole_position_smoothing_alpha: 0.25
  lateral_error_smoothing_alpha: 0.25
  yaw_error_smoothing_alpha: 0.20
  maximum_hole_center_jump_px: 45
  maximum_expected_center_jump_px: 45
  maximum_lateral_error_jump_m: 0.05
  maximum_yaw_jump_deg: 8.0

alignment:
  lateral_tolerance_px: 15
  lateral_tolerance_m: 0.02
  yaw_tolerance_deg: 1.0
  stable_frame_requirement: 10

calibration:
  # metric_calibration_valid: false (uncomment when physically calibrated)
  # INITIAL CONVERTED VALUE ONLY — requires physical verification
  # mpp_old assumed ~0.00150 m/px at 640x480; letterbox scale 1.5 => candidate 0.00100
  meter_per_pixel_at_working_distance: 0.00100
  calibration_y_min_px: null
  calibration_y_max_px: null

model:
  weights_path: "/home/otomasi2/forclift/models/yolov8n_agv_forklift.pt"
  device: "cpu"
