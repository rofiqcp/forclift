amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_nav
    map_topic: /map
    tf_broadcast: true
    transform_tolerance: 1.0
    min_particles: 500
    max_particles: 2500
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.5
    laser_min_range: 0.12
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    set_initial_pose: false
    always_reset_initial_pose: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: map
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.2
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 350000
      max_on_approach_iterations: 1500
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      minimum_turning_radius: 1.712159378317
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 10.0
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      debug_visualizations: false
      smooth_path: true
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.02
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 15
      model_dt: 0.2
      batch_size: 400
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.18
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.0
      wz_max: 0.292028888392
      ax_max: 0.75
      ax_min: -1.0
      ay_max: 0.0
      az_max: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: Ackermann
      # V35: publish MPPI debug trajectories while a NavigateToPose goal is
      # actively being controlled.  The down-sampling below keeps the marker
      # load bounded on Jetson.
      visualize: true
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 20
        time_step: 3
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.25
      inversion_yaw_tolerance: 0.45
      retry_attempt_limit: 3
      prune_distance: 3.0
      transform_tolerance: 0.5
      AckermannConstraints:
        min_turning_r: 1.712159378317
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        inflation_layer_name: inflation_layer
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
        forward_preference: false
      reset_period: 1.0
    odom_topic: /odometry/filtered
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 200
    default_server_timeout: 500
    # This AGV exposes only NavigateToPose. Loading NavigateThroughPoses here
    # makes BtNavigator require /compute_path_through_poses and abort lifecycle.
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: true
    feedback: CLOSED_LOOP
    max_velocity: [0.5, 0.0, 0.292028888392]
    min_velocity: [0.0, 0.0, -0.292028888392]
    max_accel:
    - 0.7
    - 0.0
    - 1.0
    max_decel:
    - -0.9
    - 0.0
    - -1.0
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity:
    - 0.05
    - 0.0
    - 0.02
    velocity_timeout: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: '[[0.65,0.40],[0.65,-0.40],[-0.65,-0.40],[-0.65,0.40]]'
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # V39 Humble-safe footprint field. Physical collision geometry remains
        # the full 1.30 x 0.80 m polygon; Smac/MPPI footprint checks and
        # /scan_safety + Collision Monitor remain independent and conservative.
        inflation_radius: 0.45
        cost_scaling_factor: 12.0
        inflate_unknown: false
        inflate_around_unknown: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          inf_is_valid: true
      always_send_full_costmap: true
      transform_tolerance: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      resolution: 0.05
      footprint: '[[0.65,0.40],[0.65,-0.40],[-0.65,-0.40],[-0.65,0.40]]'
      footprint_padding: 0.0
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Match local so Smac and MPPI use one compact, deterministic field.
        inflation_radius: 0.45
        cost_scaling_factor: 12.0
        inflate_unknown: false
        inflate_around_unknown: false
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        # Global planning follows the selected planning map. Raw /map remains
        # dedicated to AMCL; /nav_map is regenerated and reloaded on every switch.
        map_topic: /nav_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
          raytrace_max_range: 6.0
          inf_is_valid: true
          observation_persistence: 0.75
      always_send_full_costmap: true
      transform_tolerance: 1.0
