ekf_filter_node:
  ros__parameters:
    # Local continuous odometry for SLAM Toolbox.
    frequency: 30.0
    sensor_timeout: 0.35
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ESC wheel odometry: fuse measured forward velocity plus vy=0 as the
    # non-holonomic lateral-velocity constraint. The Ackermann
    # yaw-rate calculation depends on steering zero/ticks-per-rad calibration;
    # until that physical calibration is valid, it must not steer the EKF.
    odom0: /esc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 50
    odom0_nodelay: true
    odom0_twist_rejection_threshold: 2.0

    # IMU: fuse gyro-Z (yaw rate) only. This is intentionally safer for indoor
    # SLAM than forcing an unverified magnetometer-referenced absolute yaw into
    # local odometry. SLAM Toolbox supplies the global map->odom correction.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 100
    imu0_nodelay: true
    imu0_twist_rejection_threshold: 1.5
