collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav_smoothed
    cmd_vel_out_topic: /cmd_vel_collision_safe
    transform_tolerance: 0.2
    source_timeout: 0.3
    base_shift_correction: false
    stop_pub_timeout: 0.5
    polygons:
    - FrontStop
    - FrontSlow
    - RearStop
    - RearSlow
    FrontStop:
      type: polygon
      points:
      - 0.7
      - 0.5
      - 1.3
      - 0.5
      - 1.3
      - -0.5
      - 0.7
      - -0.5
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_front_stop
      enabled: true
    FrontSlow:
      type: polygon
      points:
      - 0.7
      - 0.65
      - 2.0
      - 0.65
      - 2.0
      - -0.65
      - 0.7
      - -0.65
      action_type: slowdown
      max_points: 1
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: polygon_front_slow
      enabled: true
    RearStop:
      type: polygon
      points:
      - -0.7
      - 0.5
      - -1.15
      - 0.5
      - -1.15
      - -0.5
      - -0.7
      - -0.5
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_rear_stop
      enabled: true
    RearSlow:
      type: polygon
      points:
      - -0.7
      - 0.65
      - -1.7
      - 0.65
      - -1.7
      - -0.65
      - -0.7
      - -0.65
      action_type: slowdown
      max_points: 1
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: polygon_rear_slow
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /scan_safety
      source_timeout: 0.3
      enabled: true
ros__parameters:
  minimum_turning_radius_m: 1.712159378317
