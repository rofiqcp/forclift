autonomy_health_manager:
  ros__parameters:
    publish_rate_hz: 10.0
    stable_recovery_sec: 1.0
    startup_grace_sec: 1.0
    lidar_health_topic: /lidar/safety_healthy
    sensor_guard_topic: /sensor_guard/healthy
    esc_ready_topic: /esc/ready
    odom_topic: /odometry/filtered
    amcl_pose_topic: /amcl_pose
    amcl_pose_require_seen: true
    global_costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    lidar_health_timeout_sec: 0.65
    sensor_guard_timeout_sec: 0.65
    esc_ready_timeout_sec: 0.8
    odom_timeout_sec: 0.5
    costmap_timeout_sec: 3.0
    global_frame: map
    odom_frame: odom
    base_frame: base_footprint
    tf_max_age_sec: 1.0
    tf_future_tolerance_sec: 1.25
    tf_jump_hold_sec: 1.5
    max_map_base_jump_m: 0.75
    max_map_base_jump_rad: 0.7
    require_amcl_covariance: true
    max_amcl_cov_x: 0.5
    max_amcl_cov_y: 0.5
    max_amcl_cov_yaw: 0.4
    lifecycle_poll_sec: 0.75
    lifecycle_response_timeout_sec: 2.0
    required_lifecycle_nodes:
    - amcl
    - planner_server
    - controller_server
    - behavior_server
    - bt_navigator
    - velocity_smoother
    - collision_monitor
    geometry_validated: true
ros__parameters:
  max_yaw_rate_rps: 0.292028888392
