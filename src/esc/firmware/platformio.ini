; Firmware tunggal: STM32F103RC board variant 0 + USART3 PB10/PB11
[platformio]
include_dir  = Src
src_dir      = Src
default_envs = esc

[env:esc]
platform        = ststm32
framework       = stm32cube
board           = genericSTM32F103RC
debug_tool      = stlink
upload_protocol = stlink
monitor_speed   = 115200

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xE
    -T./STM32F103RCTx_FLASH.ld
    -lc
    -lm
    -g
    -ggdb
