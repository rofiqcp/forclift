winch_serial_node:
  ros__parameters:
    # "auto" prioritizes /dev/winch, then STM/CDC by-id links, then ttyACM*.
    # ttyUSB* is intentionally not auto-selected so the ESC CP210x port cannot
    # be stolen by the winch process.
    port: auto
    baud: 115200
    reconnect_interval_ms: 1000
    status_period_ms: 1000
    rx_timeout_ms: 5000
