esc_driver:
  ros__parameters:
    vehicle_mode: differential_1_board
    board0_port: /dev/esc
    board1_port: ""
    cmd_vel_topic: /cmd_vel/actuator
    odom_topic: /esc/odom
    odom_frame: odom
    base_frame: base_footprint
    wheel_radius: 0.145
    publish_joint_states: false

    track_width: 0.55
    wheel_ticks_per_revolution: 90.0
    speed_setpoint_rpm_per_mps: 0.0  # 0 = otomatis dari wheel_radius
    max_motor_setpoint_rpm: 1000.0

    cmd_timeout_s: 0.25
    left_sign: 1.0
    right_sign: 1.0
