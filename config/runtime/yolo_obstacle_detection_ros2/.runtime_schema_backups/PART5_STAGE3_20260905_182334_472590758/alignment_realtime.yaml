video:
  processing_width: 1280
  processing_height: 720
  resize_mode: letterbox
  display: false
  save_output_video: false
  save_csv: true
  output_dir: /home/otomasi2/ros/log/a2_alignment_validation
  video_extension: .mp4
setpoint:
  # Target box on the 1280x720 camera display. The selected CENTER block must
  # be driven toward this box after a valid left+right hole-pallet pair exists.
  x_min_px: 525
  x_max_px: 755
  y_min_px: 560
  y_max_px: 720
  # Center of the target box; kept explicit for CSV/backward compatibility.
  x_px: 640
  y_px: 640
  # Same approximate pinhole fx already published by astra_rgb_v4l2_node at 1280px.
  focal_length_x_px: 1280.0
hole_detection:
  class_name: hole pallet
  minimum_confidence: 0.55
  minimum_separation_px: 120
  maximum_separation_px: 750
  maximum_vertical_difference_px: 120
  maximum_size_ratio: 1.8
  maximum_center_jump_px: 45
  # Hole-first gate: the left+right pallet holes must be valid first, then the
  # middle-block selector is allowed to run.
  pair_gate_frames: 2
block_detection:
  class_name: block
  minimum_confidence: 0.55
  block_offset_along_centerline_px: null
  block_offset_perpendicular_px: 0.0
  roi_half_width_px: 90
  roi_half_height_px: 75
  maximum_block_residual_px: 53
  minimum_aspect_ratio: 0.3
  maximum_aspect_ratio: 3.0
yaw:
  setpoint_yaw_offset_deg: 0.0
  maximum_yaw_jump_deg: 8.0
filter:
  hole_position_smoothing_alpha: 0.25
  lateral_error_smoothing_alpha: 0.25
  yaw_error_smoothing_alpha: 0.2
  maximum_hole_center_jump_px: 45
  maximum_expected_center_jump_px: 45
  maximum_lateral_error_jump_m: 0.05
  maximum_yaw_jump_deg: 8.0
alignment:
  lateral_tolerance_px: 15
  lateral_tolerance_m: 0.02
  yaw_tolerance_deg: 1.0
  stable_frame_requirement: 10
calibration:
  meter_per_pixel_at_working_distance: 0.001
  calibration_y_min_px: null
  calibration_y_max_px: null
