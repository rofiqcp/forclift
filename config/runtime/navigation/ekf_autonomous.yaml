ekf_filter_node:
  ros__parameters:
    # One EKF/TF owner for every navigation sensor mode.
    # SensorModeManager multiplexes measurements; EKF topology never changes.
    #   AMCL -> map -> odom
    #   EKF  -> odom -> base_footprint
    frequency: 30.0
    sensor_timeout: 0.35
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    predict_to_current_time: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Selected longitudinal velocity:
    # mode 1/2 = LiDAR scan-matching vx; mode 3 = ESC/Hall vx.
    odom0: /sensor_mode/odom_vx
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 50
    odom0_nodelay: true
    odom0_twist_rejection_threshold: 2.0

    # LiDAR-only heading source. SensorModeManager publishes this topic only
    # in mode 1. Differential yaw avoids dependence on an arbitrary odom origin.
    odom1: /sensor_mode/lidar_heading
    odom1_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: true
    odom1_relative: false
    odom1_queue_size: 30
    odom1_nodelay: true
    odom1_pose_rejection_threshold: 1.2

    # Modes 2/3 use only IMU yaw-rate; absolute magnetometer yaw stays excluded.
    imu0: /sensor_mode/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 100
    imu0_nodelay: true
