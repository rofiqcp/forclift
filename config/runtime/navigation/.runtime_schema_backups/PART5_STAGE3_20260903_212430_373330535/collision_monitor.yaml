collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav_smoothed
    cmd_vel_out_topic: /cmd_vel_collision_safe
    transform_tolerance: 0.2
    # PART-1 fail-safe freshness. The real LiDAR is expected at several Hz;
    # a stale scan must stop the robot well before multi-second timeouts.
    # Nav2 Humble ignores stale observation sources rather than issuing a
    # guaranteed fail-stop; autonomous_sensor_cmd_guard independently requires
    # /lidar/safety_healthy. Keep this short for the monitor itself.
    source_timeout: 0.30
    base_shift_correction: false
    stop_pub_timeout: 0.5

    # Humble uses max_points. Rear zones are required because Smac REEDS_SHEPP
    # and MPPI allow reverse motion (vx_min < 0).
    polygons: [FrontStop, FrontSlow, RearStop, RearSlow]
    FrontStop:
      type: polygon
      points: [0.70, 0.50, 1.30, 0.50, 1.30, -0.50, 0.70, -0.50]
      action_type: stop
      # Humble STOP triggers only when points_inside > max_points. Zero means
      # a single real safety beam inside the stop zone is sufficient.
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_front_stop
      enabled: true
    FrontSlow:
      type: polygon
      points: [0.70, 0.65, 2.00, 0.65, 2.00, -0.65, 0.70, -0.65]
      action_type: slowdown
      # Require at least two beams for slowdown; stop zone above remains 1-beam.
      max_points: 1
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: polygon_front_slow
      enabled: true
    RearStop:
      type: polygon
      points: [-0.70, 0.50, -1.15, 0.50, -1.15, -0.50, -0.70, -0.50]
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_rear_stop
      enabled: true
    RearSlow:
      type: polygon
      points: [-0.70, 0.65, -1.70, 0.65, -1.70, -0.65, -0.70, -0.65]
      action_type: slowdown
      max_points: 1
      slowdown_ratio: 0.30
      visualize: true
      polygon_pub_topic: polygon_rear_slow
      enabled: true

    observation_sources: [scan]
    scan:
      type: scan
      # SAFETY stream bypasses anti-starburst navigation filtering; robot-self
      # returns are still masked by scan_self_filter_safety.
      topic: /scan_safety
      source_timeout: 0.30
      enabled: true
