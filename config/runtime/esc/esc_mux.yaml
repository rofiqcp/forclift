esc_command_mux:
  ros__parameters:
    nav2_topic: /cmd_vel
    keyboard_topic: /cmd_vel/keyboard
    remote_topic: /cmd_vel/remote
    gui_topic: /cmd_vel/gui
    output_topic: /cmd_vel/actuator
    autonomy_gate_topic: /system/autonomy_motion_allowed
    estop_topic: /safety/estop
    keyboard_estop_request_topic: /esc/keyboard/estop_request
    standalone_mode: false
    enable_nav2: true
    enable_keyboard: true
    enable_joystick: true
    enable_remote: false
    enable_gui: false
    require_autonomy_gate: true
    autonomy_gate_timeout_sec: 0.6
    command_rate_hz: 50.0
    nav2_timeout_sec: 0.6
    keyboard_timeout_sec: 0.65
    joy_timeout_sec: 0.35
    remote_timeout_sec: 0.35
    gui_timeout_sec: 0.35
    manual_release_hold_sec: 0.5
    wheelbase_m: 0.7
    max_forward_speed_mps: 1.2
    max_reverse_speed_mps: 0.3
    max_steering_angle_rad: 0.34
    max_yaw_rate_rps: 0.6
    linear_deadband_mps: 0.03
    angular_deadband_rps: 0.01
    min_speed_for_yaw_mps: 0.05
    joy_deadman_button: 4
    joy_estop_button: 1
    joy_clear_estop_button: 3
    joy_speed_axis: 1
    joy_steering_axis: 3
    joy_turbo_button: 5
    joy_normal_max_speed_mps: 0.6
    joy_axis_deadband: 0.08
    manual_gate_topic: /system/manual_motion_allowed
    require_manual_gate: true
    manual_gate_timeout_sec: 0.6
    manual_max_forward_speed_mps: 0.3
    manual_max_reverse_speed_mps: 0.15
    manual_max_yaw_rate_rps: 0.35
